<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="从怎么给自己充电，到碰到分歧时先考虑什么。选更像平常的你，拿到一组四字母和四项偏好。">
    <meta property="og:type" content="website">
    <meta property="og:title" content="你的四字母人格偏好 · MBTI 风格自测">
    <meta property="og:description" content="从怎么给自己充电，到碰到分歧时先考虑什么。选更像平常的你，拿到一组四字母和四项偏好。">
    <title>你的四字母人格偏好 · MBTI 风格自测</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="../style.css?v=3">
    <script defer src="./data.js"></script>
    <script defer src="../scoring.js?v=3"></script>
    <script defer src="../quiz.js?v=3"></script>
  </head>
  <body data-theme="compass">
    
    
    <header class="shell top">
      <a class="wordmark" href="../index.html"><span class="mark" aria-hidden="true">答</span>生活有答</a>
      <nav class="top-links" aria-label="测试导航">
        <a class="quiet" href="../index.html">全部测试</a>
      </nav>
    </header>
    <main class="shell">
      <section id="home" class="screen cover" aria-labelledby="cover-title">
        <div class="cover-copy">
          <p class="kicker">MBTI 风格自测</p>
          <h1 id="cover-title" tabindex="-1">你的四字母人格偏好</h1>
          <p class="setting">看看你平时先往哪一边靠</p>
          <p class="intro">从怎么给自己充电，到碰到分歧时先考虑什么。选更像平常的你，拿到一组四字母和四项偏好。</p>
          <fieldset class="quiz-modes" id="quiz-modes">
            <legend>选择版本</legend>
            <div class="mode-options">
              <label class="mode-choice"><input type="radio" name="version" value="quick" checked><span><strong>10 题速测</strong><small>约 1–2 分钟</small></span></label>
              <label class="mode-choice"><input type="radio" name="version" value="full"><span><strong>40 题完整版</strong><small>约 5–7 分钟</small></span></label>
            </div>
          </fieldset>
          <button type="button" class="button primary" id="start">开始四字母自测</button>
          <p class="facts">16 种结果 · 可保存分享图</p>
          <noscript><p>请在浏览器中启用 JavaScript 以开始测试。</p></noscript>
        </div>
        <div class="cover-visual"><img src="../media/personality-type.jpg" id="cover-art" alt="" fetchpriority="high"></div>
      </section>
      <section id="game" class="screen game" aria-label="逐题作答" hidden>
        <div class="game-head"><button class="quiet" type="button" id="cover-back">返回首页</button><p id="game-count"></p></div>
        <div class="track" id="progress" role="progressbar" aria-label="答题进度" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0"><div id="progress-fill"></div></div>
        <form class="question-card" id="question-form">
          <div id="question-content">
            <p id="question-meta" class="kicker"></p>
            <h2 id="question" tabindex="-1" aria-describedby="question-meta"></h2>
            <div id="options" class="options" role="radiogroup" aria-labelledby="question"></div>
          </div>
          <div class="actions">
            <button type="button" class="button secondary" id="previous">上一题</button>
            <button type="submit" class="button primary" id="next" disabled>下一题</button>
          </div>
        </form>
      </section>
      <section id="result" class="screen result" aria-labelledby="result-heading" hidden>
        <p class="kicker result-mode" id="result-mode"></p>
        <h2 id="result-heading" tabindex="-1">你的四字母偏好</h2>
        <div class="result-grid">
          <div>
            <article class="poster" aria-label="可截图分享的结果卡">
              <img src="../media/personality-type.jpg" alt="" class="poster-art">
              <div class="poster-copy">
                <span class="poster-series">生活有答</span>
                <p class="kicker" id="identity"></p>
                <h3 id="result-name"></h3>
                <blockquote id="quote"></blockquote>
              </div>
              <p class="poster-foot">你的四字母人格偏好</p>
            </article>
            <div class="actions result-actions">
              <button type="button" class="button primary" id="download">保存分享图</button>
              <button type="button" class="button secondary" id="restart">重新测试</button>
            </div>
            <button type="button" class="quiet switch-mode" id="choose-version">切换测试版本</button>
            <p id="download-status" role="status" class="download-status"></p>
          </div>
          <div class="result-notes">
            <section><h3>答案为什么靠近这组字母</h3><p id="reason"></p></section>
            <section><h3>这一面经常帮到你</h3><p id="strength"></p></section>
            <section><h3>有时就是这么一个小细节</h3><p id="extra"></p></section>
            <section><h3>你的作答倾向</h3><dl id="tendencies" class="tendencies"></dl><p class="type-scoring-note">两边分值越接近，偏好越接近。平分时以这一维最后一道作答的方向定字母。</p></section>
          </div>
        </div>
      </section>
    </main>
    <footer class="shell footer">自编 MBTI 风格测试 · 结果用于娱乐和自我观察</footer>
  </body>
</html>
