<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="朋友碰到什么麻烦，第一个会来找你？平时不太费力的那几件事，可能正是你值得练深的本事。">
    <meta property="og:type" content="website">
    <meta property="og:title" content="你的天赋适合什么赛道">
    <meta property="og:description" content="朋友碰到什么麻烦，第一个会来找你？平时不太费力的那几件事，可能正是你值得练深的本事。">
    <title>你的天赋适合什么赛道</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="../style.css">
    <script defer src="./data.js"></script>
    <script defer src="../scoring.js"></script>
    <script defer src="../quiz.js"></script>
  </head>
  <body data-theme="studio">
    
    
    <header class="shell top">
      <a class="wordmark" href="../index.html"><span class="mark" aria-hidden="true">答</span>生活有答</a>
      <a class="quiet" href="../index.html">全部测试</a>
    </header>
    <main class="shell">
      <section id="home" class="screen cover" aria-labelledby="cover-title">
        <div class="cover-copy">
          <p class="kicker">天赋赛道</p>
          <h1 id="cover-title" tabindex="-1">你的天赋适合什么赛道</h1>
          <p class="setting">从你总被拜托的事情说起</p>
          <p class="intro">朋友碰到什么麻烦，第一个会来找你？平时不太费力的那几件事，可能正是你值得练深的本事。</p>
          <button type="button" class="button primary" id="start">找我的赛道</button>
          <p class="facts">40 道单选 · 约 5–7 分钟 · 8 种结果</p>
          <noscript><p>请在浏览器中启用 JavaScript 以开始测试。</p></noscript>
        </div>
        <div class="cover-visual"><img src="../media/talent-track.jpg" id="cover-art" alt="" fetchpriority="high"></div>
      </section>
      <section id="game" class="screen game" aria-label="逐题作答" hidden>
        <div class="game-head"><button class="quiet" type="button" id="cover-back">返回首页</button><p id="game-count"></p></div>
        <div class="track" id="progress" role="progressbar" aria-label="答题进度" aria-valuemin="0" aria-valuemax="40" aria-valuenow="0"><div id="progress-fill"></div></div>
        <form class="question-card" id="question-form">
          <div id="question-content">
            <p id="question-meta" class="kicker"></p>
            <h2 id="question" tabindex="-1" aria-describedby="question-meta"></h2>
            <div id="options" class="options" role="radiogroup" aria-labelledby="question"></div>
          </div>
          <div class="actions">
            <button type="button" class="button secondary" id="previous">上一题</button>
            <button type="submit" class="button primary" id="next" disabled>下一题</button>
          </div>
        </form>
      </section>
      <section id="result" class="screen result" aria-labelledby="result-heading" hidden>
        <h2 id="result-heading" tabindex="-1">你的天赋练习场</h2>
        <div class="result-grid">
          <div>
            <article class="poster" aria-label="可截图分享的结果卡">
              <img src="../media/talent-track.jpg" alt="" class="poster-art">
              <div class="poster-copy">
                <span class="poster-series">生活有答</span>
                <p class="kicker" id="identity"></p>
                <h3 id="result-name"></h3>
                <blockquote id="quote"></blockquote>
              </div>
              <p class="poster-foot">你的天赋适合什么赛道</p>
            </article>
            <div class="actions result-actions">
              <button type="button" class="button primary" id="download">保存分享图</button>
              <button type="button" class="button secondary" id="restart">重新测试</button>
            </div>
            <p id="download-status" role="status" class="download-status"></p>
          </div>
          <div class="result-notes">
            <section><h3>你经常用到的本事</h3><p id="reason"></p></section>
            <section><h3>可以试做的小项目</h3><p id="strength"></p></section>
            <section><h3>朋友会怎么找你</h3><p id="extra"></p></section>
            <section><h3>你的作答倾向</h3><dl id="tendencies" class="tendencies"></dl></section>
          </div>
        </div>
      </section>
    </main>
    <footer class="shell footer">趣味测试 · 结果仅供娱乐</footer>
  </body>
</html>
